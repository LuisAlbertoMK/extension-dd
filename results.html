<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Resultados DigitalData</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    margin: 0;
    padding: 24px 32px 60px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  #summary { color: #9ca3af; font-size: 13px; margin-bottom: 18px; }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  button {
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button.secondary { background: #374151; }
  button:hover { opacity: 0.9; }
  .card {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #111827;
    gap: 10px;
  }
  .url {
    font-size: 13px;
    word-break: break-all;
    color: #93c5fd;
  }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.ok { background: #065f46; color: #d1fae5; }
  .badge.no-data { background: #78350f; color: #fde68a; }
  .badge.error { background: #7f1d1d; color: #fecaca; }
  .badge.pending { background: #374151; color: #d1d5db; }
  pre {
    margin: 0;
    padding: 12px 14px;
    font-size: 12px;
    line-height: 1.4;
    max-height: 320px;
    overflow: auto;
    background: #0b1220;
    color: #d1d5db;
  }
  .empty {
    color: #6b7280;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1>Resultados combinados de digitalData</h1>
  <div id="summary"></div>
  <div class="toolbar">
    <button id="downloadJson">Descargar JSON combinado</button>
    <button id="copyJson" class="secondary">Copiar al portapapeles</button>
    <button id="refresh" class="secondary">Actualizar</button>
  </div>
  <div id="list"></div>
  <script src="results.js"></script>
</body>
</html>
